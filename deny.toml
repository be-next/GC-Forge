# cargo-deny configuration
# Enforces license compatibility with the project's MIT license and surfaces
# advisories early. See doc/specs/RISKS.md R-L4 (licences) and R-S3
# (unmaintained dependencies) for context.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Every entry must carry a reason and a matching follow-up in
# doc/specs/RISKS.md (R-S3). Only "unmaintained" advisories without a
# known vulnerability are eligible; security advisories are never ignored.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no known vulnerability; migration to jiff/time tracked in RISKS.md R-S3 (touches run-manifest timestamps)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
