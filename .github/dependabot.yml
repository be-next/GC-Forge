# Dependabot configuration — keeps four dependency surfaces current:
#   • Cargo workspace (Rust crates),
#   • Maven workload-harness (Java),
#   • GitHub Actions used in ci.yml and release.yml,
#   • Docker runner base images (Temurin 21 and 17).
#
# Each ecosystem opens at most a small batch of PRs per week and groups
# minor/patch updates together so the review surface stays manageable.
# Major-version bumps still land as separate PRs because they often
# require behavioural review.
#
# The two runner images live under docker/jdk21/ and docker/jdk17/.
# Each Dockerfile is tracked by its own Dependabot entry so a Temurin
# base-image bump produces synchronised pull requests.

version: 2

updates:
  # ── Rust workspace ──────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "deps(rust)"
    groups:
      rust-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── Java workload harness ───────────────────────────────────────────
  - package-ecosystem: maven
    directory: "/workload-harness"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "deps(java)"
    groups:
      java-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── GitHub Actions used by CI and release workflows ─────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions-all:
        applies-to: version-updates
        update-types:
          - major
          - minor
          - patch

  # ── Runner Docker image — Temurin 21 ────────────────────────────────
  - package-ecosystem: docker
    directory: "/docker/jdk21"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
      - jdk21
    commit-message:
      prefix: "deps(docker-jdk21)"

  # ── Runner Docker image — Temurin 17 ────────────────────────────────
  - package-ecosystem: docker
    directory: "/docker/jdk17"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
      - jdk17
    commit-message:
      prefix: "deps(docker-jdk17)"
